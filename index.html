<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn Links</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #0f1117;
    color: #fff;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .container { width: 100%; max-width: 700px; }
  h1 { text-align: center; margin: 0 0 8px; font-size: 34px; }
  .subtitle { text-align: center; color: #9ca3af; margin-bottom: 30px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  a {
    text-decoration: none;
    color: white;
    background: #191d27;
    border: 1px solid #2b3140;
    border-radius: 14px;
    padding: 20px;
    font-size: 17px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: .2s;
  }
  a:hover {
    transform: translateY(-2px);
    background: #222735;
    border-color: #586174;
  }
  .icon { font-size: 25px; }
  @media (max-width: 550px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="container">
  <h1>Mijn Links</h1>
  <div class="subtitle">Al mijn handige websites op één plek</div>

  <div class="grid">
    <a href="https://lovable.dev/" target="_blank"><span class="icon">🤖</span>Lovable</a>
    <a href="https://www.youtube.com/" target="_blank"><span class="icon">▶️</span>YouTube</a>
    <a href="https://studio.youtube.com/channel/UCjRad4l3DQ9_hNFhidsBmvw" target="_blank"><span class="icon">🎬</span>YouTube Studio</a>
    <a href="https://tickettool.xyz/dashboard/1439599808884117506/configs#pc-menu/pc-moderator" target="_blank"><span class="icon">🎫</span>Ticket Tool</a>
    <a href="https://www.mcserverhost.com/" target="_blank"><span class="icon">🖥️</span>MCServerHost</a>
    <a href="https://aternos.org/servers/" target="_blank"><span class="icon">⛏️</span>Aternos</a>
    <a href="https://www.roblox.com/home" target="_blank"><span class="icon">🎮</span>Roblox</a>
    <a href="https://modrinth.com/dashboard/projects" target="_blank"><span class="icon">🧩</span>Modrinth</a>
    <a href="https://docs.google.com/forms/u/0/" target="_blank"><span class="icon">📝</span>Google Forms</a>
    <a href="https://space.crunchlabs.com/selfie/TLLrzej" target="_blank"><span class="icon">📸</span>CrunchLabs</a>
  </div>
</main>
</body>
</html>
